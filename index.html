<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einteilung Sportabzeichentag</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2250%22>🏆</text></svg>">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#0f172a}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.portrait{display:block}.landscape{display:none}
@media (orientation:landscape){.portrait{display:none}.landscape{display:block}}

.screen{position:relative;z-index:2;width:100%;height:100vh;display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
.screen.active{display:flex}

.button-wrapper{width:min(1000px,90vw);display:flex;justify-content:center;align-items:center;gap:40px;flex-wrap:wrap}
.glass-btn{width:min(420px,85vw);height:120px;border-radius:35px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5);color:#0f172a;font-size:3rem;font-weight:900;cursor:pointer;transition:.2s}
.glass-btn:hover,.small-btn:hover,.info-btn:hover,.material-btn:hover{transform:translateY(-3px);background:rgba(255,255,255,.28)}

.teacher-box,.student-box{width:min(620px,92vw);padding:30px;border-radius:34px;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 45px rgba(0,0,0,.22);text-align:center}
.teacher-box h1,.student-box h1{margin:0 0 22px;font-size:clamp(2rem,5vw,3rem);font-weight:900}
select{width:100%;min-height:72px;border-radius:24px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.78);color:#0f172a;font-size:1.7rem;font-weight:900;text-align:center;padding:0 20px;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.15)}

.nav-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.small-btn,.info-btn,.material-btn,.close-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 24px rgba(0,0,0,.16);color:#0f172a;font-weight:900;cursor:pointer}
.small-btn{border-radius:18px;padding:14px 22px;font-size:1.1rem}
.top-back{position:fixed;right:22px;top:22px;z-index:5}

.content{position:absolute;top:28px;left:28px;right:28px;z-index:3;max-width:1100px}
.hello-plain{font-size:clamp(1.15rem,3.5vw,2.5rem);font-weight:900;margin:0 0 24px;text-align:left;position:absolute;top:28px;left:28px;line-height:1.3;max-width:1100px}
.info-list{font-size:1.1em;font-weight:700;display:block;margin-top:18px;line-height:1.5;max-width:1050px}
.info-line{display:block;margin:14px 0}
.time-block{display:block;font-weight:900;margin-bottom:4px}
.task-detail{display:block;margin-left:30px;font-weight:700}
.station-tag{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;color:#1e3a8a;font-weight:900;margin:0 3px;white-space:nowrap}

.task-list{font-size:clamp(1rem,2.2vw,1.55rem);font-weight:800;line-height:1.45;text-align:left}
.task-row{margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.info-btn{border-radius:14px;padding:9px 17px;font-size:1rem}
.material-btn{margin-top:16px;border-radius:18px;padding:14px 24px;font-size:1.25rem}

dialog{border:0;border-radius:26px;padding:0;width:min(760px,92vw);max-height:90vh;overflow:hidden;background:rgba(255,255,255,.94);box-shadow:0 28px 70px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid rgba(15,23,42,.12);font-weight:900;font-size:1.4rem}
.modal-body{margin:14px;padding:22px;max-height:calc(90vh - 90px);overflow:auto;font-size:1.25rem;font-weight:750;line-height:1.45;white-space:pre-line;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.close-btn{border-radius:14px;padding:10px 14px;font-size:1rem;background:rgba(239,68,68,.18);color:#7f1d1d}
.material-list{display:grid;gap:18px}
.material-list img{width:100%;height:auto;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.16);background:white}

@media (max-width:700px){
  .button-wrapper{gap:24px}
  .glass-btn{height:95px;font-size:2.2rem;border-radius:28px}
  select{font-size:1.35rem;min-height:64px}
  .content{top:18px;left:18px;right:18px}
  .hello-plain{top:18px;left:18px;right:18px}
  .top-back{right:14px;top:14px}
}

.info-material-btn{transform:scale(0.72);opacity:0.92;
  margin-top:-20px;
  position:relative;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.78);
  border-radius:30px;
  padding:32px 62px;
  background:
    radial-gradient(circle at 25% 18%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.38) 18%, transparent 38%),
    linear-gradient(145deg,#dcfce7 0%,#86efac 42%,#22c55e 72%,#16a34a 100%);
  color:#064e3b;
  font-size:1.1em;
  font-weight:950;
  letter-spacing:.02em;
  text-shadow:
    0 1px 0 rgba(255,255,255,.85),
    0 2px 6px rgba(6,78,59,.18);
  box-shadow:
    0 16px 0 #15803d,
    0 24px 36px rgba(0,0,0,.30),
    inset 0 3px 0 rgba(255,255,255,.9),
    inset 0 -7px 14px rgba(6,95,70,.32);
  cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
}

.info-material-btn::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.45) 35%,transparent 58%);
  transform:translateX(-120%);
  transition:transform .45s ease;
  pointer-events:none;
}

.info-material-btn:hover{
  transform:translateY(-4px);
  filter:saturate(1.12) brightness(1.04);
  box-shadow:
    0 20px 0 #15803d,
    0 30px 44px rgba(0,0,0,.32),
    inset 0 3px 0 rgba(255,255,255,.95),
    inset 0 -7px 14px rgba(6,95,70,.32);
}

.info-material-btn:hover::after{
  transform:translateX(120%);
}

.info-material-btn:active{
  transform:translateY(10px);
  box-shadow:
    0 6px 0 #15803d,
    0 12px 20px rgba(0,0,0,.28),
    inset 0 2px 5px rgba(255,255,255,.72),
    inset 0 -3px 8px rgba(6,95,70,.35);
}
.info-page{
  position:relative;
  z-index:3;
  width:min(980px,92vw);
  min-height:100vh;
  padding:86px 22px 30px;
}
.info-title{
  font-size:clamp(2rem,5vw,3.5rem);
  font-weight:900;
  margin:0 0 28px;
  color:#0f172a;
}
.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}
.info-menu-btn{
  min-height:76px;
  border:2px solid rgba(255,255,255,.55);
  border-radius:24px;
  background:rgba(255,255,255,.28);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#0f172a;
  font-size:1.25rem;
  font-weight:900;
  box-shadow:0 14px 30px rgba(0,0,0,.18);
  cursor:pointer;
}
.info-menu-btn:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.42);
}


#imageViewerScreen{
  overflow-y:auto !important;
  align-items:flex-start !important;
}

#imageViewerScreen .info-page{
  min-height:auto !important;
  padding-top:120px !important;
}

#infoImage{
  width:100% !important;
  height:auto !important;
  display:block !important;
  object-fit:contain !important;
  margin-top:20px !important;
}


#subInfoScreen{
  overflow-y:auto !important;
  align-items:flex-start !important;
}

#subInfoScreen .info-page{
  min-height:auto !important;
  padding-top:120px !important;
  padding-bottom:50px !important;
}

#subInfoButtons img{
  width:100% !important;
  height:auto !important;
  display:block !important;
  object-fit:contain !important;
  margin-top:0 !important;
}


.start-title{
  position:absolute;
  top:12vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:#0f172a;
  font-weight:900;
  z-index:3;
  line-height:1.25;
}
.start-title .start-main{
  font-size:clamp(1.8rem,4vw,3.2rem);
}
.start-title .start-date{
  font-size:clamp(1.2rem,2.8vw,2rem);
  margin-top:8px;
}
.start-title .start-final{
  font-size:clamp(1.2rem,2.8vw,2rem);
  margin-top:1.25em;
  letter-spacing:.04em;
}


.eis-hinweis-box{
  display:block;
  width:min(1050px, calc(100vw - 56px));
  margin:26px 0 18px 0;
  padding:22px 28px;
  border-radius:24px;
  border:2px solid rgba(255,255,255,.72);
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 14px 32px rgba(0,0,0,.16);
  color:#0f172a;
  font-size:.55em;
  font-weight:850;
  line-height:1.35;
}



/* NUR Startseite: Überschrift höher, drei Startknöpfe tiefer */
#startScreen .start-title{
  top:5vh !important;
}

#startScreen .button-wrapper{
  transform:translateY(95px) !important;
}


/* NUR Teams-Seite: Liste oben beginnen lassen und vollständig scrollbar machen */
#teamScreen{
  align-items:flex-start !important;
  justify-content:center !important;
  overflow-y:auto !important;
}

#teamScreen .info-page{
  min-height:auto !important;
  padding-top:90px !important;
  padding-bottom:60px !important;
}
.team-section{margin:0 0 30px}
.team-section-title{margin:0 0 14px;font-size:clamp(1.35rem,3vw,2rem);font-weight:900;color:#0f172a}
.team-member-section{margin:0 0 20px}
.team-member-heading{margin:0 0 10px;font-size:1.1rem;font-weight:900;color:#334155}
.team-member-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.team-member{padding:10px 13px;border-radius:13px;background:rgba(255,255,255,.62);border:1px solid rgba(15,23,42,.1);font-weight:800}
.team-empty{font-weight:700;color:#475569}
.team-material-list{display:grid;gap:16px}
.team-material-list img{display:block;width:100%;height:auto;border-radius:16px;background:white;box-shadow:0 10px 24px rgba(0,0,0,.16)}


.soft-note{
  display:block;
  font-weight:500 !important;
  font-size:0.82em !important;
  line-height:1.35;
  margin:4px 0;
}

#helloScreen{
  align-items:flex-start;
  justify-content:flex-start;
  padding:28px;
}

#helloScreen .hello-plain{
  position:relative;
  top:auto;
  left:auto;
  width:min(1100px,calc(100vw - 56px));
  max-width:1100px;
  margin:0;
  padding:28px 32px;
  font-size:clamp(1.035rem,3.15vw,2.25rem);
  background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.92);
  border-radius:24px;
  box-shadow:0 18px 45px rgba(0,0,0,.2);
}

.riege-hinweis{
  display:block !important;
  margin-top:1em !important;
  font-size:0.3125em !important;
  font-weight:400 !important;
  line-height:1.3 !important;
}


.password-form{display:grid;gap:14px;padding:22px}
.password-form label{font-size:1.15rem;font-weight:900;text-align:left}
.password-hint{margin:-6px 0 2px;color:#334155;font-size:1rem;font-weight:700;text-align:left}
.password-form input{width:100%;min-height:64px;border-radius:18px;border:2px solid rgba(15,23,42,.18);background:white;color:#0f172a;font-size:1.8rem;font-weight:900;text-align:center;letter-spacing:.12em;padding:8px 16px}
.password-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.password-error{min-height:1.4em;color:#b91c1c;font-weight:900;text-align:left}
.password-submit{border:1px solid rgba(255,255,255,.45);background:rgba(34,197,94,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 24px rgba(0,0,0,.16);color:#064e3b;font-weight:900;cursor:pointer;border-radius:14px;padding:12px 18px;font-size:1.05rem}
.password-submit:hover{transform:translateY(-2px);background:rgba(34,197,94,.40)}

#studentInfoScreen{
  align-items:flex-start;
  justify-content:flex-start;
  padding:28px;
}
#studentInfoScreen .content{
  position:relative;
  top:auto;
  left:auto;
  right:auto;
  width:min(1100px,calc(100vw - 56px));
  max-width:1100px;
  padding:28px 32px;
  margin:0;
  background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.92);
  border-radius:24px;
  box-shadow:0 18px 45px rgba(0,0,0,.2);
  font-size:clamp(1.035rem,3.15vw,2.25rem);
  font-weight:900;
  line-height:1.35;
}
.student-detail-list{display:block;margin-top:18px;font-size:.72em;line-height:1.5}
.student-detail-card{display:block;margin-top:18px;padding:18px 22px;border-radius:18px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.8)}
.student-detail-label{display:block;margin-bottom:5px;font-size:.72em;color:#334155;text-transform:uppercase;letter-spacing:.04em}
.student-detail-value{display:block;font-weight:850;white-space:pre-line}
.student-riege-note{display:block;margin-top:16px;padding-top:16px;border-top:1px solid rgba(15,23,42,.16);font-size:.86em;font-weight:700;line-height:1.5}

</style>
</head>
<body>
<img src="background_portrait.jpg" class="bg portrait" alt="">
<img src="background_landscape.jpg" class="bg landscape" alt="">

<main id="startScreen" class="screen active">
  <div class="start-title">
    <div class="start-main">Sportabzeichentag der <span style="color:red;">I</span><span style="color:#facc15;">G</span><span style="color:green;">S</span> Kandel</div>
    <div class="start-date">07. September 2026</div>
    <div class="start-final">FINALE EINTEILUNG</div>
  </div>
  <div class="button-wrapper">
    <button class="glass-btn" onclick="showTeacherMenu()">Lehrer</button>
    <button class="glass-btn" onclick="showStudentMenu()">Schüler</button>
    <button class="glass-btn" onclick="openTeams()">Teams</button>
  </div>
</main>


<main id="teamScreen" class="screen">
  <button class="small-btn top-back" onclick="closeTeamsPage()">Zurück zur Startseite</button>
  <div class="info-page">
    <h1 class="info-title">Teams</h1>
    <div id="teamButtons"></div>
  </div>
</main>

<main id="teacherScreen" class="screen">
  <button class="small-btn top-back" onclick="showStart()">Zurück zur Startseite</button>
  <div class="teacher-box">
    <h1>Lehrer auswählen</h1>
    <select id="teacherSelect" onchange="selectTeacher()">
      <option value="">Kürzel wählen</option>
    </select>
  </div>
</main>

<main id="studentScreen" class="screen">
  <button class="small-btn top-back" onclick="showStart()">Zurück zur Startseite</button>
  <div class="student-box">
    <h1>Schüler auswählen</h1>
    <select id="studentSelect" onchange="selectStudent()">
      <option value="">Schüler wählen</option>
    </select>
  </div>
</main>

<main id="helloScreen" class="screen">
  <button class="small-btn top-back" onclick="goBackFromHello()">Zurück</button>
  <div id="normalHello" class="hello-plain"></div>
</main>


<main id="infoMaterialScreen" class="screen">
  <button class="small-btn top-back" onclick="backFromInfoMaterial()">Zurück</button>
  <div class="info-page">
    <h1 class="info-title">Infomaterial</h1>
    <div class="info-grid">
      <button class="info-menu-btn" onclick="showSimpleInfoPage('Ablaufplan allgemein')">Ablaufplan allgemein</button>
      <button class="info-menu-btn" onclick="showRiegeplaene()">Pläne für Riegeführung</button>
      <button class="info-menu-btn" onclick="showSimpleInfoPage('Tribüne')">Tribüne</button>
      <button class="info-menu-btn" onclick="showAufbauplaene()">Aufbauplan der Stationen</button>
      <button class="info-menu-btn" onclick="showSimpleInfoPage('Stadionplan')">Stadionplan</button>
      <button class="info-menu-btn" onclick="openTeams()">Teams</button>
    </div>
  </div>
</main>

<main id="subInfoScreen" class="screen">
  <button class="small-btn top-back" onclick="showInfoMaterial()">Zurück</button>
  <div class="info-page">
    <h1 id="subInfoTitle" class="info-title"></h1>
    <div id="subInfoButtons" class="info-grid"></div>
  </div>
</main>


<main id="imageViewerScreen" class="screen">
  <button class="small-btn top-back" onclick="showPreviousInfoSubPage()">Zurück</button>
  <div class="info-page">
    
    <img id="infoImage" src="" alt="" style="width:100%;height:auto;border-radius:22px;box-shadow:0 18px 45px rgba(0,0,0,.25);background:white;">

    
    <div id="stadionplanExtra"><img src="Stadionplan.jpg" alt="Stadionplan" style="width:100%;height:auto;border-radius:22px;box-shadow:0 18px 45px rgba(0,0,0,.25);background:white;"></div>
  </div>
</main>


<main id="stadionplanScreen" class="screen">
  <button class="small-btn top-back" onclick="showInfoMaterial()">Zurück</button>
  <div class="info-page">
    <div id="stadionplanExtra"><img src="Stadionplan.jpg" alt="Stadionplan" style="width:100%;height:auto;border-radius:22px;box-shadow:0 18px 45px rgba(0,0,0,.25);background:white;"></div>
  </div>
</main>

<main id="studentInfoScreen" class="screen">
  <button class="small-btn top-back" onclick="showStudentMenu()">Zurück</button>
  <div id="studentContent" class="content"></div>
</main>

<main id="blankScreen" class="screen"></main>


<dialog id="releaseNoticeDialog">
  <div class="modal-head">
    <span>Hinweis</span>
    <button class="close-btn" onclick="closeReleaseNotice()">Schließen</button>
  </div>
  <div class="modal-body">Dieser Bereich wird Ende der Woche für dich freigegeben.</div>
</dialog>

<dialog id="teamDialog">
  <div class="modal-head">
    <span>Teams</span>
    <button class="close-btn" onclick="closeTeamPopup()">Schließen</button>
  </div>
  <div class="modal-body">folgt in Kürze!</div>
</dialog>

<dialog id="studentPasswordDialog">
  <form method="dialog" class="password-form" onsubmit="checkStudentPassword(event)">
    <div class="modal-head" style="padding:0 0 14px;border-bottom:1px solid rgba(15,23,42,.12);">
      <span>Passwort eingeben</span>
      <button class="close-btn" type="button" onclick="closeStudentPasswordPopup()">Schließen</button>
    </div>
    <label for="studentPasswordInput">Passwort</label>
    <div class="password-hint">Nutze dein Geburtsdatum im Format TT.MM.JJJJ.</div>
    <input id="studentPasswordInput" type="password" inputmode="text" maxlength="10" placeholder="TT.MM.JJJJ" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div id="studentPasswordError" class="password-error"></div>
    <div class="password-actions">
      <button class="close-btn" type="button" onclick="closeStudentPasswordPopup()">Abbrechen</button>
      <button class="password-submit" type="submit">Öffnen</button>
    </div>
  </form>
</dialog>

<dialog id="infoDialog">
  <div class="modal-head">
    <span>Info</span>
    <button class="close-btn" onclick="closeInfo()">Schließen</button>
  </div>
  <div id="infoText" class="modal-body"></div>
</dialog>

<dialog id="materialDialog">
  <div class="modal-head">
    <span>Material</span>
    <button class="close-btn" onclick="closeMaterial()">Schließen</button>
  </div>
  <div class="modal-body"></div>
</dialog>

function formatStudentDisplay(student){
  const nachname = (student.nachname || "").trim();
  const vorname = (student.vorname || "").trim();
  const kurz = nachname ? nachname.substring(0,2) + "." : "";
  return (kurz + " " + vorname).trim();
}

function uniqueTeamCodes(codes){

function teacherAssignmentText(person){

}

  return uniqueTeamCodes(teachers.filter(person => test(teacherAssignmentText(person), person)).map(person => person.kuerzel));

function studentsMatching(test){
  return students.filter(test).sort((a,b) =>
    a.nachname.localeCompare(b.nachname,"de",{sensitivity:"base"}) ||
    a.vorname.localeCompare(b.vorname,"de",{sensitivity:"base"})

}

function formatInfoLine(text){
  text = text
    .replaceAll("[station]", "<span class='station-tag'>")
    .replaceAll("[/station]", "</span>");

  const range = text.match(/^((?:[0-9]{1,2}:[0-9]{2}\s*(?:Uhr)?|[0-9]{1,2}\s*Uhr)\s*-\s*(?:[0-9]{1,2}:[0-9]{2}\s*(?:Uhr)?|[0-9]{1,2}\s*Uhr))[:.]?\s*(.*)$/);
  if(range){
    return "<span class='time-block'>" + range[1] + "</span><span class='task-detail'>" + range[2] + "</span>";
  }

  const single = text.match(/^([0-9]{1,2}:[0-9]{2}\s*Uhr|[0-9]{1,2}\s*Uhr)[:.]\s*(.*)$/);
  if(single){
    return "<span class='time-block'>" + single[1] + "</span><span class='task-detail'>" + single[2] + "</span>";
  }

  return text;
}

function escapeTeacherText(value){
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatTeacherLines(value){
  return escapeTeacherText(value).replaceAll("\n", "<br>");
}

function formatTeacherText(text){
  const notice = "Hinweis: Anweisungen an die Klasse sollen primär durch die MSS-Riegeführer geschehen. Falls das nicht klappt, müsst ihr das übernehmen. Bei groben Verstößen von Schülern eurer Klasse könnt ihr diese zur Turnierleitung schicken.";
  const value = String(text || "");
  const position = value.indexOf(notice);

  if(position === -1){
    return formatTeacherLines(value);
  }

  const mainText = value.slice(0, position).trim();
  return formatTeacherLines(mainText)
    + "<span class='riege-hinweis'>"
    + formatTeacherLines(notice)
    + "</span>";
}

function getRiegeTeacherCodes(student){
  const match = String(student.aufgabe || "").match(/^Riegeführung Klasse\s+([^:]+)/i);

  const assignmentStart = "Riegeführung Klasse " + klasse;
  return teachers
    .filter(person => [person.text1, person.text2].some(text => String(text || "").includes(assignmentStart)))
    .map(person => person.kuerzel);
}

const fixedStudentStations = new Set([
  "Sprint", "Kugelstoßen", "Hochsprung",
  "Weitsprung A", "Weitsprung B", "Weitwurf A", "Weitwurf B",
  "Standweitsprung A", "Standweitsprung B", "Standweitsprung C",
  "Seilspringen A", "Seilspringen B", "Seilspringen C"
]);

function isFixedStationStudent(student){
  return fixedStudentStations.has(String(student.aufgabe || "").trim());
}

function getStationTeacherCodes(student){
  const station = String(student.aufgabe || "").trim();
  if(!fixedStudentStations.has(station)) return [];

  return teachers.filter(person => {
    const assignment = [person.ueberschrift1, person.text1, person.ueberschrift2, person.text2].join(" ");
    if(assignment.includes("Unterstützung bei Station " + station)) return true;
    if(station === "Hochsprung" && assignment.includes("beim Hochsprung unterstützen")) return true;
    if(station === "Sprint" && assignment.includes("Stationsleitung Sprint")) return true;
    if(station === "Kugelstoßen" && assignment.includes("Stationsleitung Kugelstoßen")) return true;
    if(station.startsWith("Standweitsprung ") && assignment.includes("Stationsleitung Standweitsprung A B C")) return true;
    if(station.startsWith("Seilspringen ") && assignment.includes("Stationsleitung Seilspringen A B C")) return true;
    return assignment.includes("Stationsleitung " + station);
  }).map(person => person.kuerzel);
}

function renderStudentInfo(student){
  let info = String(student.info || "");
  const codes = getStationTeacherCodes(student);
  if(codes.length){
    const teacherLabel = codes.length === 1

    info += "\n\n" + teacherLabel + codes.join(", ") + ".";

}

function decodeBase64(value){
  return Uint8Array.from(atob(value), character => character.charCodeAt(0));
}

function encodeBase64(bytes){
  let binary = "";
  bytes.forEach(byte => binary += String.fromCharCode(byte));
  return btoa(binary);
}

async function createStudentAccessHash(password, saltBase64){
  const encoder = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    encoder.encode(password),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: decodeBase64(saltBase64),
      iterations: 30000,
      hash: "SHA-256"
    },
    keyMaterial,
    256
  );
  return encodeBase64(new Uint8Array(bits));
}

async function checkStudentPassword(event){
  event.preventDefault();
  if(currentStudentIndex === null) return;
  const student = students[currentStudentIndex];
  const input = document.getElementById("studentPasswordInput");
  const error = document.getElementById("studentPasswordError");
  const password = input.value.trim();
  try{
    const candidateHash = await createStudentAccessHash(password, student.zugangscodeSalt);
    if(candidateHash === student.zugangscodeHash){
      unlockCurrentStudent();
      return;
    }
  }catch(errorDetails){
    console.error("Die Zugangscode-Prüfung ist fehlgeschlagen.", errorDetails);
  }
  error.textContent = "Das Geburtsdatum stimmt nicht. Bitte im Format TT.MM.JJJJ eingeben.";
  input.select();
}

function closeStudentPasswordPopup(){
  const dialog = document.getElementById("studentPasswordDialog");
  if(dialog && dialog.open) dialog.close();
  studentSelect.value = "";
  currentStudentIndex = null;
}

document.addEventListener("keydown", function(event){
  const dialog = document.getElementById("studentPasswordDialog");
  if(dialog.open && event.key.toLowerCase() === "a"){
    event.preventDefault();
    unlockCurrentStudent();
  }
});

function openInfo(text){
  document.getElementById("infoText").textContent = text;
  document.getElementById("infoDialog").showModal();
}

function closeInfo(){
  document.getElementById("infoDialog").close();
}

function openMaterial(images){
  const body = document.querySelector("#materialDialog .modal-body");
  body.innerHTML = "<div class='material-list'>" + images.map(name =>
    "<img src='" + name + ".jpg' alt='" + name + "' onerror=\"this.onerror=null;this.src='" + name + ".png';\">"
  ).join("") + "</div>";
  document.getElementById("materialDialog").showModal();
}

function closeMaterial(){
  document.getElementById("materialDialog").close();
}
